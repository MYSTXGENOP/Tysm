<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYSM V6 // PHANTOM BOOT</title>
<style>
:root{--pink:#ff80c7;--green:#79ff9a;--ink:#070810;--pale:#efcbe6}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;color:var(--pale);font:11px Consolas,'Lucida Console',monospace;user-select:none}
#field{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .24s ease}
#top{position:absolute;left:14px;right:18px;top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#a39baf;font-size:9px;letter-spacing:.13em;white-space:nowrap}
#top span:first-child{opacity:.88}
#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;width:min(550px,92vw);display:flex;align-items:center;flex-direction:column}
#ankhBox{position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;filter:drop-shadow(0 0 9px #fa8fd0ad) drop-shadow(0 0 14px #7dfaa74f);isolation:isolate}
#ankh{height:88px;width:88px;object-fit:contain;image-rendering:pixelated;display:block;filter:contrast(1.07)}
#ankhBox::before{content:"";position:absolute;width:100px;height:98px;background:repeating-linear-gradient(0deg,transparent 0 6px,#ff79cb32 7px,#71ff9b28 8px);mix-blend-mode:screen;opacity:.56;pointer-events:none;animation:hscan 1.35s linear infinite}
#ankhBox::after{content:"";position:absolute;width:118px;height:1px;top:50%;left:-3px;background:#a7ffa3;opacity:0;box-shadow:0 0 8px #6effa6}
body.phase-override #ankhBox,body.phase-takeover #ankhBox,body.phase-break #ankhBox{opacity:1}
body.phase-takeover #ankhBox::after{animation:wave .22s steps(3) 4}
@keyframes wave{0%{opacity:0;transform:translateY(-24px)}50%{opacity:.9;transform:translateY(30px)}100%{opacity:0;transform:translateY(-24px)}}
@keyframes hscan{from{transform:translateY(-9px)}to{transform:translateY(9px)}}
#ankhFallback{font-size:9px;line-height:1.5;color:var(--green);display:none;width:180px}
#title{margin-top:0;font-size:clamp(19px,2.2vw,30px);font-weight:700;letter-spacing:.145em;white-space:nowrap;color:#f4a4db;text-shadow:-2px 0 #8cfeb47d,2px 0 #ff49b976,0 0 15px #e254bd4b;min-height:42px;line-height:42px}
#sub{font-size:9px;letter-spacing:.25em;color:#a9a2bc;text-transform:uppercase;margin-bottom:25px;min-height:15px}
#bar{width:min(305px,75vw);height:3px;background:#35273c;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ff77ba 0%,#e0b4de 56%,#79ffa1 100%);box-shadow:0 0 10px #ff77ba9a}
#tag{position:absolute;left:12px;bottom:18px;font-size:10px;letter-spacing:.03em;color:#e19ac6;opacity:0;transition:opacity .25s ease}
#skip{pointer-events:auto;position:absolute;right:16px;bottom:15px;padding:8px 14px;border:1px solid #bd83ac;border-radius:5px;background:#1f1525ec;color:#efd0e4;font:11px Consolas,monospace;cursor:pointer;transition:box-shadow .16s ease,border-color .16s ease}
#skip:hover{border-color:var(--green);box-shadow:0 0 16px #72ffad65}
#skip:focus-visible{outline:2px solid var(--green);outline-offset:3px}
body.phase-signal #title,body.phase-override #title,body.phase-takeover #title{text-shadow:-3px 0 #79ff9aa0,3px 0 #ff58b8aa,0 0 22px #ee80c88c}
body.phase-break #hud{opacity:0}
@media(max-width:600px){#top{font-size:7px}#title{font-size:19px}#ankh{height:74px;width:74px}#ankhBox{height:94px}}
@media(prefers-reduced-motion:reduce){#ankhBox::before,#ankhBox::after{animation:none}}
</style>
</head>
<body class="phase-init">
<canvas id="field" aria-hidden="true"></canvas>
<div id="hud">
 <div id="top"><span>SYSTEM INITIALIZATION // LOCAL</span><span>6s · ESC TO SKIP</span></div>
 <div id="center">
  <div id="ankhBox"><img id="ankh" src="original_ankh.gif" alt="Original Tysm V5 spinning ankh"><span id="ankhFallback">ORIGINAL V5 ANKH<br>LOADS FROM TYSM INSTALLATION</span></div>
  <div id="title">INITIALIZING SYSTEM</div>
  <div id="sub">LOADING DESKTOP ENVIRONMENT</div>
  <div id="bar"><div id="fill"></div></div>
 </div>
 <span id="tag">creator - Riko</span>
 <button id="skip" type="button">Skip ↗</button>
</div>
<script>
'use strict';
// Native Qt window uses this flag to close on a true skip; no new Python action endpoint.
window.__tysmBootFinished=false;
const $=s=>document.getElementById(s),field=$('field'),ctx=field.getContext('2d',{alpha:true}),title=$('title'),sub=$('sub'),fill=$('fill'),tag=$('tag');
const duration=6000,palette=['#ff81c8','#79ffa9','#f4b0d9','#a5ffce'];
const sentences=['INITIALIZING SYSTEM','SIGNAL INTERRUPTION','ACCESS OVERRIDE','SIGNAL AUTHORITY // TYSM','RETURNING TO DESKTOP'];
const descriptions=['LOADING DESKTOP ENVIRONMENT','CORRUPTED SIGNAL DETECTED','AUTHORITY CLAIMED // TYSM','CONNECTION STABILIZED','TRANSMISSION COMPLETE'];
let w=1,h=1,dpr=1,t0=null,tLast=null,dead=false,seed=2524,raf=0;
function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function size(){w=innerWidth;h=innerHeight;dpr=Math.min(1.5,devicePixelRatio||1);field.width=Math.ceil(w*dpr);field.height=Math.ceil(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
$('ankh').addEventListener('error',()=>{$('ankh').style.display='none';$('ankhFallback').style.display='block'});
// The original V5 GIF is used as an <img> with no attempt to recreate or retime its frames.
const streaks=Array.from({length:43},()=>({x:rand(),y:rand()*1.3-.4,speed:420+rand()*1090,length:28+rand()*155,width:rand()>.78?3:1,c:palette[Math.floor(rand()*palette.length)]}));
const holes=Array.from({length:240},()=>({x:rand(),y:rand(),ww:25+rand()*140,hh:7+rand()*65,when:4900+rand()*1000})).sort((a,b)=>a.when-b.when);
const lines=Array.from({length:19},(_,i)=>({y:rand(),phase:rand()*1000,len:32+rand()*210,thick:i%4===0?3:1}));
const opacity=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
function backdrop(t){ctx.clearRect(0,0,w,h);ctx.fillStyle='#090711';ctx.fillRect(0,0,w,h);let g=ctx.createRadialGradient(w*.51,h*.48,3,w*.51,h*.48,Math.max(w,h)*.68);g.addColorStop(0,'#3b19353f');g.addColorStop(1,'#07081199');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#b68dac17';for(let y=120;y<h;y+=104)ctx.fillRect(0,y,w,1);
  ctx.fillStyle='#b697b808';for(let x=0;x<w;x+=96)ctx.fillRect(x,0,1,h);
  if(t>780){ctx.fillStyle='#f4a4d010';for(let k=0;k<14;k++){const yy=(k*103+(Math.floor(t/60)*3))%h;ctx.fillRect(0,yy,w,1)}}
}
function rain(dt,t){if(t<630||t>5470)return;const intensity=Math.min(1,opacity(t,630,1800))*(1-opacity(t,5200,5500));let num=Math.floor(streaks.length*(.35+.65*intensity));
  for(let i=0;i<num;i++){let s=streaks[i];s.y+=s.speed*dt/h;if(s.y>1.15){s.y=-.15;s.x=rand()}const x=Math.round(s.x*w),y=Math.round(s.y*h),len=Math.round(s.length*(.8+intensity*.4));ctx.globalAlpha=.3+intensity*.42;ctx.fillStyle=s.c;ctx.fillRect(x,y-len,s.width,len);ctx.globalAlpha=.92;ctx.fillStyle='#fff2fa';ctx.fillRect(x-1,y-5,Math.max(2,s.width),6)}ctx.globalAlpha=1;
}
function interruption(t){if(t<1200||t>5520)return;const surge=t>4100?2:1;const step=Math.floor(t/54);ctx.save();
  for(let n=0;n<22*surge;n++){const q=(step*73+n*91)%989;const x=Math.floor(((q*37)%977)/977*w);const y=Math.floor(((q*53)%953)/953*h);ctx.fillStyle=(n%3===0?'#70ff9b':n%3===1?'#fa69b9':'#dcc1de')+(surge===2?'55':'30');ctx.fillRect(x,y,22+(q%190),n%5===0?4:1)}
  for(let n=0;n<9*surge;n++){const z=(n*211+step*19)%1009, y=Math.floor((z/1009)*h),wid=20+((z*17)%220),x=(n%2)?w-wid:0;
   ctx.fillStyle=n%2?'#69fda126':'#ff74c52c';ctx.fillRect(x,y,wid,1+n%3)}
  if(t>1700&&t<4900){const centerY=Math.round(h*.47);for(let j=0;j<9;j++){const y=centerY-110+j*23+((step+j*7)%5-2)*4;ctx.fillStyle=j%3===0?'#72ff9b37':'#fb7cc544';ctx.fillRect(Math.floor(w*.5)-80+((step*17+j*31)%190-95),y,25+(step+j*13)%90,j%4===0?3:1)}}
  ctx.restore();
}
function split(t){if(t<2500||t>4900)return;const step=Math.floor(t/80),r=(step*17)%1009;ctx.save();for(let n=0;n<5;n++){const y=Math.floor(((step*13+n*151)%997)/997*h),x=(step+n)%2?Math.floor(w*.73):Math.floor(w*.07);ctx.fillStyle=n%2?'#6cffa82f':'#f883cf35';ctx.fillRect(x,y,24+((r+n*67)%130),1+n%3)}ctx.restore();}
function fracture(t){if(t<4850)return;
 ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';
 for(const p of holes){if(t<p.when)break;ctx.fillRect(Math.floor(p.x*w),Math.floor(p.y*h),p.ww,p.hh)}
 if(t>5250){let ease=opacity(t,5250,5960);ease=ease*ease*(3-2*ease);const width=ease*w*.52;ctx.fillRect(0,0,width,h);ctx.fillRect(w-width,0,width,h)}
 if(t>5710){let f=opacity(t,5710,5960);ctx.fillRect(0,0,w,h*f*.45);ctx.fillRect(0,h-h*f*.45,w,h*f*.45)}
 ctx.restore();
}
function updateHud(t){const phase=t<900?0:t<1700?1:t<4050?2:t<5000?3:4;const types=['init','signal','override','takeover','break'];document.body.className='phase-'+types[phase];title.textContent=sentences[phase];sub.textContent=descriptions[phase];fill.style.width=(Math.min(t,duration)/duration*100).toFixed(2)+'%';tag.style.opacity=t>2070&&t<5150?'1':'0';}
function finish(){if(dead)return;dead=true;cancelAnimationFrame(raf);window.__tysmBootFinished=true;ctx.clearRect(0,0,w,h);$('hud').style.display='none';field.style.display='none';document.body.style.pointerEvents='none';}
function tick(now){if(dead)return;if(t0===null){t0=now;tLast=now}const t=now-t0,dt=Math.min(.04,(now-tLast)/1000);tLast=now;backdrop(t);rain(dt,t);interruption(t);split(t);fracture(t);updateHud(t);if(t>=duration)finish();else raf=requestAnimationFrame(tick)}
$('skip').addEventListener('click',finish);addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();finish()}});
raf=requestAnimationFrame(tick);
</script>
</body>
</html>
