const $=id=>document.getElementById(id),canvas=$('fx'),ctx=canvas.getContext('2d');let active=false,startAt=0,previous=0,request=0,particles=[],splinters=[],lastFace=1,faceHold=0,frameCount=0;const shimmer=new Image();shimmer.src='reference_shimmer.png';function resize(){const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const rand=(a,b)=>a+Math.random()*(b-a),colors=['#f59bdb','#9beef0','#fbe8f5'];function newStar(initial=false){let h=innerHeight,w=innerWidth;return{x:rand(15,w-15),y:initial?rand(-h,-20):rand(-170,-20),speed:rand(650,1200),len:rand(55,145),width:Math.random()<.25?3:2,color:colors[Math.floor(rand(0,colors.length))],drift:rand(-30,30),live:true}}function reset(){cancelAnimationFrame(request);active=true;frameCount=0;startAt=previous=performance.now();particles=Array.from({length:22},()=>newStar(true));splinters=Array.from({length:18},()=>({x:rand(0,innerWidth),y:rand(0,innerHeight),w:rand(18,115),h:rand(8,43)}));$('boot').style.display='block';$('boot').style.opacity='1';$('boot').className='';$('credit').style.opacity=0;request=requestAnimationFrame(draw)}function end(){active=false;cancelAnimationFrame(request);$('boot').style.opacity='0';setTimeout(()=>{if(!active)$('boot').style.display='none'},260)}function meteor(s,dt,w,h){s.speed=Math.min(s.speed+400*dt,1500);s.y+=s.speed*dt;s.x+=s.drift*dt;if(s.y-s.len>h+20){s.live=false;return}const x=Math.round(s.x),y=Math.round(s.y),len=Math.round(s.len*(.8+s.speed/1400));ctx.globalAlpha=.25;ctx.fillStyle=s.color;ctx.fillRect(x-2,y-len,5,len);ctx.globalAlpha=.85;ctx.fillRect(x-1,y-len*.7,2,len*.7);ctx.globalAlpha=1;ctx.fillStyle='#fff5fa';ctx.fillRect(x-1,y-2,3,6);ctx.fillStyle=s.color;ctx.fillRect(x-3,y,7,2);ctx.fillRect(x,y-4,2,9)}function draw(now){if(!active)return;const t=(now-startAt)/1000,dt=Math.min(.04,(now-previous)/1000);previous=now;const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#080914';ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.5,h*.43,10,w*.5,h*.43,Math.max(w,h)*.65);glow.addColorStop(0,'#2c172e');glow.addColorStop(1,'#080914');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);const phase=t<1?0:t<2?1:t<4.1?2:t<5?3:4;const titles=['INITIALIZING SYSTEM','SIGNAL INTERRUPTION','ACCESS OVERRIDE','YOU SHOULD SMILE MORE','SYSTEM ONLINE'];const subs=['LOADING DESKTOP ENVIRONMENT','UNKNOWN SIGNAL DETECTED','SIGNAL AUTHORITY // TYSM','SIGNATURE CONFIRMED','RETURNING TO DESKTOP'];$('boottext').textContent=titles[phase];$('sub').textContent=subs[phase];$('fill').style.width=Math.min(100,t/6*100)+'%';$('boot').classList.toggle('glitch',phase>=2&&phase<4);$('boot').classList.toggle('out',t>5.3);$('credit').style.opacity=t>2&&t<5.4?1:0;
if(t>1.2){ctx.globalAlpha=.14;for(let i=0;i<8;i++){let y=(i*119+frameCount*3)%h;ctx.fillStyle=i%2?'#e17bb5':'#83d6e2';ctx.fillRect(0,y,w,1)}ctx.globalAlpha=1}if(t>2){if(frameCount%8===0&&t<4.65)particles.push(newStar());for(const s of particles)if(s.live)meteor(s,dt,w,h);particles=particles.filter(s=>s.live);if(frameCount%4===0){for(let j=0;j<3;j++){let x=rand(0,w),y=rand(0,h);ctx.fillStyle=j%2?'#ec7cba66':'#69e0ed55';ctx.fillRect(x,y,rand(35,170),rand(1,3))}}if(shimmer.complete&&shimmer.naturalWidth){ctx.globalAlpha=.35+Math.random()*.22;const sy=rand(h*.1,h*.78);ctx.drawImage(shimmer,0,sy,rand(105,200),rand(60,120));ctx.drawImage(shimmer,w-rand(90,170),rand(h*.05,h*.7),rand(105,175),rand(55,110));ctx.globalAlpha=1}}if(t>4.3){let count=Math.floor(((t-4.3)/1.5)*splinters.length);for(let i=0;i<count;i++){let a=splinters[i];ctx.clearRect(a.x,a.y,a.w,a.h)}if(t>5.05){const r=Math.min(1,(t-5.05)/.85);ctx.clearRect(0,0,w*r,h);ctx.clearRect(w*(1-r),0,w*r,h)}}frameCount++;if(t>=6){end();return}request=requestAnimationFrame(draw)}
function chooseFace(){// Demo of Tysm-controlled choice: weighted randomness + persistence, not a user picker
faceHold++;if(faceHold<2&&Math.random()<.6)return;faceHold=0;let pool=[1,2,3,4,5,6],choice=pool[Math.floor(Math.random()*pool.length)];if(choice===lastFace&&Math.random()<.8)choice=choice%6+1;lastFace=choice;$('portrait').src=`face${choice}.png`}function reply(){chooseFace();const options=['I was listening. Unfortunately for you.','Already on it. Try to look impressed.','Interesting. I have a few thoughts about that.','You really do keep things interesting.'];const e=document.createElement('div');e.className='msg';e.textContent=options[Math.floor(Math.random()*options.length)];$('msgs').append(e);$('msgs').scrollTop=99999}function send(){const v=$('input').value.trim();if(!v)return;const e=document.createElement('div');e.className='msg user';e.textContent=v;$('msgs').append(e);$('input').value='';setTimeout(reply,420)}$('dock').onclick=()=>$('chat').classList.toggle('open');$('toggle').onclick=()=>$('chat').classList.toggle('open');$('close').onclick=()=>$('chat').classList.remove('open');$('demo').onclick=()=>{$('chat').classList.add('open');reply()};$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter')send()};$('replay').onclick=reset;$('skip').onclick=end;addEventListener('keydown',e=>{if(e.key==='Escape'&&active)end()});reset();
